<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H3 工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1b2e'/%3E%3Cpath d='M9 8v16m14-16v16M9 16h14' stroke='%2355ccff' stroke-width='4'/%3E%3C/svg%3E">
  <style>:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#e6edf7;background:#0b1220;font-synthesis:none;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}header{height:88px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #223048}.brand{color:#e6edf7;text-decoration:none;display:flex;align-items:center;gap:14px;font-size:18px;font-weight:650}.brand span{background:#172b43;color:#65d2ff;border:1px solid #2d5271;padding:8px;border-radius:8px;letter-spacing:-1px}main{width:min(1100px,88vw);margin:auto;flex:1}.login{width:min(420px,100%);margin:90px auto}.eyebrow{font-size:14px;color:#65d2ff;letter-spacing:2px;margin:0 0 18px}h1{font-size:clamp(28px,4vw,40px);line-height:1.35;margin:0;font-weight:650;letter-spacing:-1px}.intro{color:#a3b2c8;line-height:1.8;margin:16px 0 32px;font-size:16px}label{display:block;font-size:14px;margin:22px 0 10px}input{width:100%;background:#111d30;color:#edf4ff;border:1px solid #36465e;border-radius:8px;padding:14px;font-size:16px;outline:none}input:focus{border-color:#65d2ff;box-shadow:0 0 0 3px #65d2ff22}button{cursor:pointer;font:inherit;border-radius:8px;padding:12px 18px}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.primary{width:100%;margin-top:30px;background:#65d2ff;color:#071421;border:0;font-weight:650}.primary:hover{background:#96e0ff}button:disabled{opacity:.6;cursor:wait}.quiet{background:transparent;color:#b1c5dc;border:1px solid #354359;font-size:14px;margin-left:18px}.heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:65px}.chip{background:#14263c;color:#aacce6;border:1px solid #294460;padding:10px 14px;border-radius:6px;font-size:14px}.notice{padding:18px 20px;background:#142034;border-left:3px solid #65d2ff;line-height:1.7;color:#b8c9dd;margin:32px 0}.empty{border:1px dashed #34435a;border-radius:12px;padding:70px 20px;text-align:center}.empty-mark{color:#5c799b;font-size:36px}h2{font-size:20px;font-weight:500}.empty p{color:#8fa4be;font-size:16px}#login-message{color:#ffbaa9;line-height:1.7;min-height:1.7em;font-size:14px}footer{padding:28px 6vw;color:#7f94af;font-size:14px;display:flex;justify-content:space-between}[hidden]{display:none!important}@media(max-width:600px){header{height:72px}.login{margin:55px auto}.heading{align-items:flex-start;flex-direction:column;margin-top:40px}.chip{font-size:14px}footer{gap:18px;flex-direction:column}.empty{padding:40px 15px}}
textarea,select{width:100%;background:#111d30;color:#edf4ff;border:1px solid #36465e;border-radius:8px;padding:14px;font:inherit;font-size:16px}textarea{resize:vertical}.composer{padding:28px;border:1px solid #29394f;border-radius:12px;margin-bottom:28px;background:#101b2c}.composer h2{margin:0}.options{display:flex;gap:20px}.options>div{flex:1}.hint{font-size:14px;color:#93a6bf}.task-row{display:flex;gap:16px;align-items:center;border:1px solid #2b3d56;padding:20px;border-radius:10px;margin-bottom:14px}.task-row>div{flex:1}.task-row h2{font-size:16px;margin:0}.task-row p{font-size:14px;color:#a9bdd6;margin:12px 0 0}.download{background:#65d2ff;border:0;color:#091c2e}#task-message{line-height:1.7;font-size:14px;color:#b3c8e0}@media(max-width:600px){.options,.task-row{flex-direction:column;align-items:stretch}.composer{padding:20px}.task-row .quiet{margin:0}}
</style><script src="config.js"></script>
</head>
<body>
  <header><a class="brand" href="./"><span>H3</span> 工作台</a><div id="identity" hidden><span id="username"></span><button id="logout" class="quiet">退出登录</button></div></header>
  <main>
    <section id="login-panel" class="login">
      <p class="eyebrow">远程创作</p><h1>连接你的工作流</h1><p class="intro">登录后提交任务，由工作站完成生成。</p>
      <form id="login-form">
        <label for="username-input">账号</label><input id="username-input" name="username" autocomplete="username" required maxlength="64">
        <label for="password-input">密码</label><input id="password-input" name="password" type="password" autocomplete="current-password" required maxlength="256">
        <button class="primary" id="login-button" type="submit">登录工作台</button>
      </form>
      <p id="login-message" role="status" aria-live="polite"></p>
    </section>
    <section id="workspace" hidden>
      <div class="heading"><div><p class="eyebrow">任务中心</p><h1>正在运行</h1></div><span class="chip">H3 · 720p · 速度优先</span></div>
      <p id="service-message" class="notice" role="status"></p>
      <form id="task-form" class="composer">
        <h2>新建任务</h2>
        <label for="prompt">描述视频</label><textarea id="prompt" name="prompt" rows="4" maxlength="4000" required placeholder="用 Picture 1、Picture 2 指代参考图，描述动作、场景与声音。"></textarea>
        <label for="images">参考图片（最多4张，每张8MB）</label><input id="images" name="images" type="file" accept="image/png,image/jpeg,image/webp" multiple required><p class="hint">不展示图片预览，按选择顺序编号。</p>
        <div class="options"><div><label for="orientation">画幅</label><select id="orientation" name="orientation"><option value="landscape">横屏 · 1280 × 720</option><option value="portrait">竖屏 · 720 × 1280</option></select></div><div><label for="seconds">时长</label><select id="seconds" name="seconds"><option value="0.9166666666666666">约1秒 · 测试</option><option value="2.1666666666666665">约2秒</option><option value="5.166666666666667" selected>约5秒</option></select></div></div>
        <button id="submit-button" class="primary" type="submit">提交生成</button><p id="task-message" role="status"></p>
      </form>
      <div id="tasks" class="tasks"><div class="empty"><span class="empty-mark">—</span><h2>暂无运行任务</h2><p>运行中的任务将在这里显示进度。</p></div></div>
    </section>
  </main>
  <footer>H3 工作台 <span>账号会话仅保留在当前页面</span></footer>
<script>'use strict';
let token = '';
let poll;
let downloading = false;
const receipts = new Map();
const $ = id => document.getElementById(id);
const base = (window.PORTAL_API || (['localhost', '127.0.0.1'].includes(location.hostname) ? location.origin : '')).replace(/\/$/, '');
async function api(path, options = {}) {
  if (!base) throw new Error('远程工作站尚未连接，请联系管理员。');
  let response;
  try {
    response = await fetch(base + path, {cache: 'no-store', ...options, headers: {...(options.body instanceof FormData ? {} : {'Content-Type': 'application/json'}), ...(token ? {'Authorization': 'Bearer ' + token} : {}), ...options.headers}});
  } catch (_) { throw new Error('无法连接工作站，请确认工作站已启动。'); }
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '请求失败');
  return data;
}
async function refresh() {
  try {
    const data = await api('/api/tasks'); $('service-message').textContent = data.message;
    $('submit-button').disabled = !data.accepting_tasks || data.tasks.some(t => ['uploading','queued','running','ready','downloading'].includes(t.state));
    if (!downloading) renderTasks(data.tasks);
  }
  catch (error) { $('service-message').textContent = error.message; }
}
$('login-form').addEventListener('submit', async event => {
  event.preventDefault(); $('login-button').disabled = true; $('login-message').textContent = '';
  try {
    const result = await api('/api/login', {method: 'POST', body: JSON.stringify({username: $('username-input').value.trim(), password: $('password-input').value})});
    token = result.token; $('password-input').value = ''; $('username').textContent = result.username;
    $('login-panel').hidden = true; $('workspace').hidden = false; $('identity').hidden = false;
    await refresh(); poll = setInterval(refresh, 5000);
  } catch (error) { $('login-message').textContent = error.message; }
  finally { $('login-button').disabled = false; }
});
function renderTasks(tasks) {
  const container = $('tasks'); container.replaceChildren();
  if (!tasks.length) {
    const empty = document.createElement('div'); empty.className = 'empty';
    const title = document.createElement('h2'); title.textContent = '暂无运行任务';
    const subtitle = document.createElement('p'); subtitle.textContent = '提交后在这里查看状态并下载结果。';
    empty.append(title, subtitle); container.append(empty); return;
  }
  for (const task of tasks) {
    const row = document.createElement('article'); row.className = 'task-row';
    const body = document.createElement('div'); const name = document.createElement('h2');
    name.textContent = '任务 ' + task.id.slice(0, 8);
    const status = document.createElement('p'); status.textContent = task.message;
    body.append(name, status); row.append(body);
    if (task.state === 'ready') {
      const button = document.createElement('button'); button.className = 'download';
      button.textContent = receipts.has(task.id) ? '已保存，清理工作站副本' : '下载视频';
      button.onclick = () => receipts.has(task.id) ? acknowledge(task.id, receipts.get(task.id)) : download(task.id);
      row.append(button);
    }
    if (['ready','queued','failed'].includes(task.state)) {
      const cancel = document.createElement('button'); cancel.className = 'quiet'; cancel.textContent = '放弃并清理';
      cancel.onclick = async () => {
        if (!confirm('放弃该任务并删除工作站上的临时文件？')) return;
        try { await api('/api/tasks/' + task.id, {method:'DELETE'}); await refresh(); }
        catch(error) { $('task-message').textContent=error.message; }
      }; row.append(cancel);
    }
    container.append(row);
  }
}
async function acknowledge(id, receipt) {
  try {
    await api('/api/tasks/' + id + '/downloaded', {method:'POST',body:JSON.stringify({receipt})});
    receipts.delete(id); $('task-message').textContent = '下载完成，工作站上的输入和结果已删除。'; await refresh();
  } catch(error) { receipts.set(id,receipt); $('task-message').textContent = '文件已保存，但清理确认失败。请点击任务旁的清理按钮重试。'; }
}
async function download(id) {
  let writable;
  downloading = true;
  try {
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({suggestedName:'H3-result.mp4',types:[{description:'MP4视频',accept:{'video/mp4':['.mp4']}}]});
      writable = await handle.createWritable();
    }
    const response = await fetch(base + '/api/tasks/' + id + '/download', {cache:'no-store',headers:{Authorization:'Bearer '+token}});
    if (!response.ok) throw new Error('下载失败，请重试。');
    const receipt = response.headers.get('X-Download-Receipt');
    if (writable) {
      const reader = response.body.getReader(); let received=0;
      while (true) { const {value,done}=await reader.read(); if(done) break; received+=value.byteLength; await writable.write(value); }
      if (received !== Number(response.headers.get('Content-Length'))) throw new Error('文件传输未完成，请重试。');
      await writable.close(); writable=null;
      await acknowledge(id,receipt);
    } else {
      const blob = await response.blob();
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url;a.download='H3-result.mp4';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
      receipts.set(id,receipt);
      $('task-message').textContent='浏览器已接收文件。确认下载已保存后，点击“已保存，清理工作站副本”。';
    }
  } catch(error) {
    if(writable) await writable.abort().catch(()=>{});
    if(error.name!=='AbortError') $('task-message').textContent=error.message;
  } finally { downloading=false; await refresh(); }
}
$('task-form').addEventListener('submit',async event=>{
  event.preventDefault(); $('submit-button').disabled=true; $('task-message').textContent='正在上传…';
  try {
    const data=new FormData($('task-form'));
    await api('/api/tasks',{method:'POST',body:data});
    $('task-form').reset(); $('task-message').textContent='任务已提交，输入内容已从表单清空。'; await refresh();
  } catch(error) { $('task-message').textContent=error.message; $('submit-button').disabled=false; }
});
if (document.modelContext?.registerTool) {
  document.modelContext.registerTool({name:'get_my_task_status',description:'读取当前登录账号的任务状态，不返回素材、提示词或结果。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>{const data=await api('/api/tasks');await refresh();return {tasks:data.tasks};}});
}
$('logout').addEventListener('click', async () => {
  try { await api('/api/logout', {method: 'POST'}); } catch (_) {}
  token = ''; clearInterval(poll); $('workspace').hidden = true; $('identity').hidden = true; $('login-panel').hidden = false;
});
</script></body>
</html>
